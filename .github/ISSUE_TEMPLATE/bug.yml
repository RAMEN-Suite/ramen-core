name: Bug report
description: Report a reproducible problem.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit when working from source.
      placeholder: '@ramen-suite/core 0.1.0'
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What happened?
      description: Describe the actual and expected behaviour. Include diagnostic codes when available.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a small TypeScript or JSON model example, or clear steps to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node.js, TypeScript and operating system versions, or the browser when relevant.
