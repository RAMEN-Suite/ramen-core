name: Feature request
description: Suggest a new capability or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Consumer problem
      description: What problem should RAMEN Core solve?
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Desired behaviour
      description: Describe the expected result. An API example is optional.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
