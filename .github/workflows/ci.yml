name: CI

on:
  push:
    branches: [main, 'deps/**']
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  node-ci:
    name: CI
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/node-ci.yml@4c5a73211c21748e0ba7f044b706c70551c0f6bb # v0.2.9
    with:
      lint-scripts: build lint format typecheck schema:check docs:diagnostics:check docs:build
      test-scripts: test:coverage
      package-script: package:check
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private

  supply-chain:
    name: CI
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/supply-chain.yml@4c5a73211c21748e0ba7f044b706c70551c0f6bb # v0.2.9
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private

  security:
    name: CI
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/security.yml@4c5a73211c21748e0ba7f044b706c70551c0f6bb # v0.2.9
    with:
      semgrep-configs: p/security-audit p/secrets p/typescript p/javascript
      codeql-config-file: ./.github/codeql/codeql-config.yml
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      security-events: write # required for uploading results to code scanning
