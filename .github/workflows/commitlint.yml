name: Commitlint

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/commitlint-node.yml@c5539fc96b3ecd6d342f28f49f3000f64b9556fe # v0.2.2
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
