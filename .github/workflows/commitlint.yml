name: Commitlint

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/commitlint-node.yml@3fef79e03598b698818270ed2eec99af952971f6 # v0.2.6
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
