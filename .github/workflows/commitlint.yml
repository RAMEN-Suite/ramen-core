name: Commitlint

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/commitlint-node.yml@bf7ce40db2970dfc8cf349ca84d3fd924e779c4d # v0.2.10
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
