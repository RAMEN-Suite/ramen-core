name: Commitlint

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/commitlint-node.yml@175bf2c7820eac7ddd6c59de31a823c8743616f7 # v0.2.4
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
