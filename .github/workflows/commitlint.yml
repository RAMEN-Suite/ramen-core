name: Commitlint

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/commitlint-node.yml@25a074cb7def054f196b57c26729160b0cb8b7f9 # v0.2.7
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
