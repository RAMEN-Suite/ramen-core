name: Commitlint

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/commitlint-node.yml@6d3172a90120e48b47d20f2fecd1dfbb73239460 # v0.2.1
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
