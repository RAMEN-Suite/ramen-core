name: Commitlint

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/commitlint-node.yml@4c5a73211c21748e0ba7f044b706c70551c0f6bb # v0.2.9
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
