name: Commitlint

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/commitlint-node.yml@052bd3de631153d42e86a32e27fdb28fbe82f0dc # v0.2.12
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
