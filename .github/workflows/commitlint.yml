name: Commitlint

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/commitlint-node.yml@4d7ff68c07504c7b68a4f2b9ef2ae2062abc1239 # v0.2.11
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
