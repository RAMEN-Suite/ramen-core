name: Commitlint

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/commitlint-node.yml@cbbaea105a016f3fca8adca1e5af11313b790f05 # v0.2.8
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
