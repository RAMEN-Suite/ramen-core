name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/pr-title-node.yml@c5539fc96b3ecd6d342f28f49f3000f64b9556fe # v0.2.2
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
