name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/pr-title-node.yml@052bd3de631153d42e86a32e27fdb28fbe82f0dc # v0.2.12
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
