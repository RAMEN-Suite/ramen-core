name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/pr-title-node.yml@4d7ff68c07504c7b68a4f2b9ef2ae2062abc1239 # v0.2.11
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
