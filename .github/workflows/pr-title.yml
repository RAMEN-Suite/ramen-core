name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/pr-title-node.yml@87aa0a65d3291204cd60dae10e8b8773ca12da1b # v0.2.5
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
