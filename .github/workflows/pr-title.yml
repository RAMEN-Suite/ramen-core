name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/pr-title-node.yml@4c5a73211c21748e0ba7f044b706c70551c0f6bb # v0.2.9
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
