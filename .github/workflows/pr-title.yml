name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/pr-title-node.yml@25a074cb7def054f196b57c26729160b0cb8b7f9 # v0.2.7
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
