name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/pr-title-node.yml@bf7ce40db2970dfc8cf349ca84d3fd924e779c4d # v0.2.10
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
