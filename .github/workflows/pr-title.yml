name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/pr-title-node.yml@cbbaea105a016f3fca8adca1e5af11313b790f05 # v0.2.8
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
