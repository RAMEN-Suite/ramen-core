name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: Conventional
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/pr-title-node.yml@175bf2c7820eac7ddd6c59de31a823c8743616f7 # v0.2.4
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
