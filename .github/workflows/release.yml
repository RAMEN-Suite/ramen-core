name: Release

on:
  workflow_dispatch:
    inputs:
      release_as:
        description: 'Force a specific version, e.g. 1.0.0. Leave blank for automatic bump.'
        required: false
        type: string
      dry_run:
        description: 'Run everything without pushing or publishing.'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    name: Check branch
    runs-on: ubuntu-latest
    steps:
      - name: Only release from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must run on main, got $GITHUB_REF"
            exit 1
          fi

  ci:
    name: CI
    needs: [guard]
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      security-events: write # required for uploading results to code scanning

  release:
    name: Release
    needs: [ci]
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/npm-release.yml@6d3172a90120e48b47d20f2fecd1dfbb73239460 # v0.2.1
    with:
      build-script: package:check
      release-as: ${{ inputs.release_as }}
      dry-run: ${{ inputs.dry_run }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read # checkout; the release App token does every write
      id-token: write # required to sign the provenance and SBOM attestations
      attestations: write # required to persist the attestations

  npm:
    name: npm
    needs: [release]
    uses: RAMEN-Suite/ramen-workflows/.github/workflows/npm-publish.yml@6d3172a90120e48b47d20f2fecd1dfbb73239460 # v0.2.1
    with:
      dry-run: ${{ inputs.dry_run }}
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      id-token: write # required for npm trusted publishing (OIDC)
